name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Black
        run: black --check .

      - name: Import order check
        run: isort --check-only .

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports --disable-error-code type-arg --disable-error-code no-any-return --disable-error-code call-arg --disable-error-code no-untyped-def

      - name: Security scan with Bandit
        run: bandit -r app/ -c pyproject.toml

      - name: SAST with Semgrep
        run: |
          pip install semgrep
          semgrep scan --config .semgrep.yml --exclude-rule python-hardcoded-secret --error app/

      - name: Dependency audit
        run: pip-audit

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x

      - name: Run security tests
        run: pytest tests/unit/test_security.py -m security -v --tb=short -x

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -x

      - name: Run all tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Build Docker image
        run: docker build -t dialitech-ml-service .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dialitech-ml-service
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: dialitech-ml-service
